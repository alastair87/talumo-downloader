[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talumo-downloader"
version = "0.1.0"
description = "Standalone Hugging Face model downloader with a persistent queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117",
  "huggingface_hub>=0.31,<0.32",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<0.0.21",
  "requests>=2.32,<3",
  "sqlalchemy>=2.0.40,<3",
  "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
